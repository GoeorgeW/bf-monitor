name: Revisar precios

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 min (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:          # botón "Run workflow" = actualizar ahora
  issues:
    types: [opened]           # peticiones de añadir / editar / borrar desde la app

permissions:
  contents: write
  issues: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Solo el dueño del repositorio puede añadir/editar/borrar
    if: github.event_name != 'issues' || github.event.issue.user.login == github.repository_owner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Revisar todos los precios
        if: github.event_name != 'issues'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/update.py

      - name: Procesar petición de la app
        if: github.event_name == 'issues'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/update.py issue

      - name: Guardar datos
        run: |
          git config user.name "bf-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          git diff --cached --quiet && exit 0
          git commit -m "Precios $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done

      - name: Responder y cerrar la petición
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --comment "$(cat $RUNNER_TEMP/reply.md)"
